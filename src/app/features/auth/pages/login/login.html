<div class="flex h-screen w-full justify-center items-center">
  <!-- LEFT SIDE (fixed image) -->
  <div class="hidden md:flex md:w-[35%] h-full">
    <img src="/images/Left.svg" alt="Login Illustration" class="h-full w-full object-cover" />
  </div>

  <!-- RIGHT SIDE (rest of the space) -->
  <div class="flex w-[65%] items-center justify-center">
    <!-- FORM -->
    <div class="flex flex-col w-full min-w-[400px] max-w-lg px-6 min-h-[350px]">
      <!-- Header -->
      <div class="mb-6 text-left flex flex-col gap-2">
        <h1 class="text-4xl font-semibold">Sign In</h1>
        <p class="text-base text-gray-500">Please enter your credentials to sign in.</p>
      </div>

      <!-- Form -->
      <form [formGroup]="loginForm" class="flex flex-col flex-1 justify-around">
        <div class="flex items-center gap-2 p-4 rounded-md bg-gray-100">
          <img src="/icons/profile.svg" class="h-6 w-6" />
          <input
            formControlName="username"
            type="text"
            placeholder="Username"
            class="w-full outline-none text-base bg-gray-100"
          />
        </div>

        <div class="flex items-center gap-2 p-4 rounded-md bg-gray-100">
          <img src="/icons/lock.svg" class="h-6 w-6" />
          <input
            formControlName="password"
            type="password"
            placeholder="Password"
            class="w-full outline-none text-base bg-gray-100"
          />
        </div>

        <div>
          <p class="text-red-600 text-sm mb-2">{{ errorMessage }}</p>
        </div>

        <div
          (click)="login()"
          [class.disabled]="loginForm.invalid"
          class="w-[100px] bg-blue-600 text-white py-3 rounded self-end hover:bg-blue-800 transition-colors flex items-center justify-center cursor-pointer"
        >
          <button type="submit" class="text-base">Log</button>
          <img class="cursor-pointer" src="/icons/chevron-right.svg" class="inline h-5 w-5 ml-2" />
        </div>
      </form>
    </div>
  </div>
</div>
