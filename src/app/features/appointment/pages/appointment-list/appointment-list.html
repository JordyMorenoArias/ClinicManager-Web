<main class="h-full w-full pt-20 md:max-w-6xl mx-auto px-6">
  <div class="flex justify-between items-center my-6">
    <h1 class="text-2xl font-semibold">Manage, edit or add new appointments</h1>
    <button
      class="w-[70px] bg-blue-600 text-white py-3 gap-1 rounded-4xl self-end hover:bg-blue-800 transition-colors cursor-pointer"
      routerLink="/appointments/new"
    >
      Add
    </button>
  </div>
  <form [formGroup]="formFilters" class="w-full md:flex md:justify-end gap-5">
    <mat-form-field appearance="fill">
      <mat-label>Enter a date range</mat-label>
      <mat-date-range-input [rangePicker]="picker">
        <input matStartDate formControlName="start" placeholder="Start date" />
        <input matEndDate formControlName="end" placeholder="End date" />
      </mat-date-range-input>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-date-range-picker #picker></mat-date-range-picker>

      @if (formFilters.controls.start.hasError('matStartDateInvalid')) {
        <mat-error>Invalid start date</mat-error>
      }
      @if (formFilters.controls.end.hasError('matEndDateInvalid')) {
        <mat-error>Invalid end date</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Select</mat-label>
      <mat-select formControlName="status" placeholder="Status">
        <mat-option [value]="AppointmentStatusEnum.Pending">Pending</mat-option>
        <mat-option [value]="AppointmentStatusEnum.Confirmed">Confirmed</mat-option>
        <mat-option [value]="AppointmentStatusEnum.Completed">Completed</mat-option>
        <mat-option [value]="AppointmentStatusEnum.Cancelled">Cancelled</mat-option>
        <mat-option [value]="AppointmentStatusEnum.NoShow">No Show</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
  <section class="mt-6"></section>
</main>
