<div
  [class.shadow-blue-300]="selectedPatientId === patient.id.toString()"
  class="w-full flex items-center justify-between p-6 bg-white shadow-md hover:shadow-lg transition-all duration-200 cursor-pointer rounded-lg"
>
  <!-- Left Content -->
  <div class="flex items-center gap-4">
    <!-- Avatar -->
    <div
      class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-semibold text-lg"
    >
      {{ patient.fullName.charAt(0) }}
    </div>

    <!-- Info -->
    <div class="flex flex-col">
      <span class="text-base font-semibold text-gray-800">
        {{ patient.fullName }}
      </span>

      <span class="text-sm text-gray-500"> ID: {{ patient.identification }} </span>

      <span class="text-sm text-gray-400">
        {{ patient.phone }}
      </span>
    </div>
  </div>

  <!-- Right Badge -->
  <div class="px-3 py-1 text-sm rounded-full bg-green-100 text-green-700 font-medium">
    {{ patient.dateOfBirth | date: 'dd/MM/yyyy' }}
  </div>
</div>
