<!-- Patient Card -->
<article class="w-full p-6 bg-gray-50 rounded-lg shadow-md flex flex-col justify-between">
  <!-- Top: Avatar + Name -->
  <div class="flex items-center gap-4 mb-5">
    <!-- Avatar Placeholder -->
    <div class="w-14 h-14 rounded-full bg-blue-100 flex items-center justify-center">
      <!-- User Icon -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-7 h-7 text-blue-600"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M5.121 17.804A9 9 0 1118.88 17.8M15 11a3 3 0 11-6 0 3 3 0 016 0z"
        />
      </svg>
    </div>

    <div>
      <h2 class="text-lg font-semibold">
        {{ patient.fullName }}
      </h2>

      <p class="text-sm text-gray-500">ID: {{ patient.identification }}</p>
    </div>
  </div>

  <!-- Patient Info -->
  <div class="space-y-2 text-sm">
    <p>
      <span class="font-medium">Phone:</span>
      {{ patient.phone }}
    </p>

    <p>
      <span class="font-medium">Email:</span>
      {{ patient.email }}
    </p>

    <p>
      <span class="font-medium">Address:</span>
      {{ patient.address }}
    </p>

    <p>
      <span class="font-medium">Date of Birth:</span>
      {{ patient.dateOfBirth | date: 'MMMM d, yyyy' }}
    </p>
  </div>

  <!-- Actions -->
  <div class="flex justify-end mt-6">
    <button
      class="px-6 py-2 bg-blue-600 text-white rounded-full hover:bg-blue-800 transition-colors cursor-pointer tracking-wide"
      routerLink="/patients/{{ patient.id }}"
    >
      Edit
    </button>
  </div>
</article>
