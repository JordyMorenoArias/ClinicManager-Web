@if (appointment) {
  <article class="w-full p-5 bg-gray-50 rounded-lg shadow-md">
    <div>
      <div class="flex justify-between mb-5">
        <div class="">
          <h2 class="text-lg font-semibold">{{ appointment.patient.fullName }}</h2>
          <h3 class="text-base text-gray-500">{{ appointment.doctor.fullName }}</h3>
        </div>
        <div class="flex items-center">
          <span
            [ngClass]="{
              'bg-amber-100 text-amber-600':
                appointment.appointmentStatus === appointmentStatusEnum.Pending,
              'bg-emerald-100 text-emerald-600':
                appointment.appointmentStatus === appointmentStatusEnum.Confirmed,
              'bg-blue-100 text-blue-600':
                appointment.appointmentStatus === appointmentStatusEnum.Completed,
              'bg-rose-100 text-rose-600':
                appointment.appointmentStatus === appointmentStatusEnum.Cancelled,
            }"
            class="px-3 py-1 text-sm font-medium rounded-full mr-4 inline-flex items-center"
          >
            {{ appointment.appointmentStatus | appointmentStatus }}
          </span>

          <span class="text-base text-sm text-gray-500">
            {{ appointment.date | date: 'MMMM d, yyyy - hh:mma' }}</span
          >
        </div>
      </div>
      <div class="border-b border-gray-200 pb-6 mb-8">
        <p class="text-base">
          {{ appointment.reason }}
        </p>
      </div>
      <div class="flex flex-row gap-2">
        <button
          class="w-24 bg-blue-600 text-white py-3 gap-1 rounded-3xl self-end hover:bg-blue-800 transition-colors flex items-center justify-center cursor-pointer tracking-wider"
          routerLink="/appointments/{{ appointment.id }}"
        >
          ADJUST
        </button>
      </div>
    </div>
  </article>
}
