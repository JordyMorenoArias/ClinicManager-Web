<div class="flex h-screen w-full justify-center items-center">
  <!-- LEFT SIDE (fixed image) -->
  <div class="hidden md:flex md:w-[35%] h-full">
    <img src="/images/Left.svg" alt="Login Illustration" class="h-full w-full object-cover" />
  </div>

  <!-- RIGHT SIDE (rest of the space) -->
  <div class="flex w-[65%] items-center justify-center">
    <!-- FORM -->
    <div class="flex flex-col w-full min-w-[400px] max-w-lg px-6 min-h-[350px]">
      <!-- Header -->
      <div class="mb-6 text-left flex flex-col gap-2">
        <h1 class="text-4xl font-semibold">Sign In</h1>
        <p class="text-base text-gray-500">Please enter your credentials to sign in.</p>
      </div>

      <!-- Form -->
      <form
        [formGroup]="loginForm"
        class="flex flex-col flex-1 justify-around"
        (ngSubmit)="login()"
      >
        <div class="flex items-center gap-2 p-4 rounded-md bg-gray-100">
          <svg
            class="w-6 h-6 rounded-full shrink-0 text-gray-400"
            viewBox="0 0 1024 1024"
            version="1.1"
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
          >
            <path
              d="M819.2 729.088V757.76c0 33.792-27.648 61.44-61.44 61.44H266.24c-33.792 0-61.44-27.648-61.44-61.44v-28.672c0-74.752 87.04-119.808 168.96-155.648 3.072-1.024 5.12-2.048 8.192-4.096 6.144-3.072 13.312-3.072 19.456 1.024C434.176 591.872 472.064 604.16 512 604.16c39.936 0 77.824-12.288 110.592-32.768 6.144-4.096 13.312-4.096 19.456-1.024 3.072 1.024 5.12 2.048 8.192 4.096 81.92 34.816 168.96 79.872 168.96 154.624z"
            />
            <path
              d="M359.424 373.76a168.96 152.576 90 1 0 305.152 0 168.96 152.576 90 1 0-305.152 0Z"
            />
          </svg>
          <input
            formControlName="username"
            type="text"
            placeholder="Username"
            class="w-full outline-none text-base bg-gray-100"
          />
        </div>

        <div class="flex items-center gap-2 p-4 rounded-md bg-gray-100">
          <svg
            class="h-6 w-6 rounded-full shrink-0 text-gray-400"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 -960 960 960"
            width="24px"
            fill="currentColor"
          >
            <path
              d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm0-80h480v-400H240v400Zm240-120q33 0 56.5-23.5T560-360q0-33-23.5-56.5T480-440q-33 0-56.5 23.5T400-360q0 33 23.5 56.5T480-280ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80ZM240-160v-400 400Z"
            />
          </svg>
          <input
            formControlName="password"
            type="password"
            placeholder="Password"
            class="w-full outline-none text-base bg-gray-100"
          />
        </div>

        @if (errorMessage$ | async; as error) {
          <p class="text-red-600 text-sm mb-2">{{ error }}</p>
        }

        <button
          type="submit"
          [disabled]="loginForm.invalid"
          class="w-[120px] bg-blue-600 text-white py-3 gap-1 rounded self-end hover:bg-blue-800 transition-colors flex items-center justify-center cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span class="text-base">Log In</span>

          <svg
            class="hidden lg:block w-5 h-5"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M9.5 17L14.5 12L9.5 7"
              stroke="currentColor"
              stroke-width="2.03636"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </form>
    </div>
  </div>
</div>
