<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-6 bg-white p-6 rounded-lg">
  <input
    type="text"
    [ngClass]="
      isInvalid('fullName')
        ? 'border-red-300 placeholder-red-300'
        : 'border-gray-200 placeholder-gray-500'
    "
    formControlName="fullName"
    placeholder="Full Name"
    class="w-full h-12 p-3 text-base border-b-2 rounded-md outline-none"
  />

  <input
    type="text"
    [ngClass]="
      isInvalid('identification')
        ? 'border-red-300 placeholder-red-300'
        : 'border-gray-200 placeholder-gray-500'
    "
    formControlName="identification"
    placeholder="Identification"
    class="w-full h-12 p-3 text-base border-b-2 rounded-md outline-none"
  />

  <input
    type="text"
    [ngClass]="
      isInvalid('phone')
        ? 'border-red-300 placeholder-red-300'
        : 'border-gray-200 placeholder-gray-500'
    "
    formControlName="phone"
    placeholder="Phone Number"
    class="w-full h-12 p-3 text-base border-b-2 rounded-md outline-none"
  />

  <input
    type="text"
    [ngClass]="
      isInvalid('email')
        ? 'border-red-300 placeholder-red-300'
        : 'border-gray-200 placeholder-gray-500'
    "
    formControlName="email"
    placeholder="Email"
    class="w-full h-12 p-3 text-base border-b-2 rounded-md outline-none"
  />

  <input
    type="text"
    [ngClass]="
      isInvalid('address')
        ? 'border-red-300 placeholder-red-300'
        : 'border-gray-200 placeholder-gray-500'
    "
    formControlName="address"
    placeholder="Address"
    class="w-full h-12 p-3 text-base border-b-2 rounded-md outline-none"
  />

  <mat-form-field>
    <mat-label>Date of Birth</mat-label>
    <input matInput [matDatepicker]="picker" formControlName="dateOfBirth" />
    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <button
    [disabled]="form.invalid"
    type="submit"
    class="w-full h-12 mt-4 text-white font-semibold rounded-md transition-colors"
    [ngClass]="
      form.invalid
        ? 'bg-gray-300 cursor-not-allowed'
        : 'bg-blue-500 hover:bg-blue-600 cursor-pointer'
    "
  >
    SUBMIT
  </button>
</form>
